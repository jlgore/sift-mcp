name: Build & publish sift-gateway image

# Builds the Valhuntir SIFT gateway image from THIS fork and pushes it to the
# owner's GHCR namespace (ghcr.io/<owner>/sift-gateway). The agentcontainers
# sift-platform demo pulls ghcr.io/jlgore/sift-gateway:demo, so pushes on the
# demo branch publish that tag.

on:
  push:
    branches:
      - main
      - upstream/standalone-features
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      vhir_ref:
        description: "vhir-cli (Valhuntir) git ref to bundle"
        required: false
        default: "main"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sift-gateway
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=demo,enable=${{ github.ref == 'refs/heads/upstream/standalone-features' || github.event_name == 'workflow_dispatch' }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VHIR_REF=${{ github.event.inputs.vhir_ref || 'main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
