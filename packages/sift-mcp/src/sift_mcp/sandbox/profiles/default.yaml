# Default sandbox profile for forensic tool execution on the SIFT Workstation.
#
# Validated on SIFT (Ubuntu 24.04): read-only binding /usr + /opt covers the
# dotnet runtime (/usr/lib/dotnet, Zimmerman tools in /opt), Volatility 3
# (/usr/local/bin/vol + /opt/volatility3 venv), and Sleuth Kit. Non-existent
# paths are skipped at build time, so the same profile is a no-op for missing
# mounts on a WSL dev box.
name: default
description: "Standard forensic analysis — evidence read-only, network isolated"

# Base read-only binds (identity: same path inside and outside the sandbox).
# Tools live on the host; we expose them read-only rather than rebuilding an image.
read_only:
  - /usr
  - /bin
  - /sbin
  - /lib
  - /lib64
  - /opt
  - /etc            # tool config + data: foremost.conf, magic, localtime; bulk_extractor
                    # SIGSEGVs without it. Read-only, so no host-config tampering risk.

# Case-dir layout: the case directory is bound read-write (for out/, symbols/,
# audit/), but these subdirs are forced read-only at the kernel level so the
# original evidence store stays immutable — blocking new-file creation and
# deletion in evidence/, not just modification of referenced files. The
# read-write carve-out re-opens a derived-artifacts subdir on top (bwrap's
# later-bind-wins ordering). Paths are relative to the active case dir;
# non-existent ones are skipped.
case_readonly_subdirs:
  - evidence
case_readwrite_subdirs:
  - evidence/extracted

# Mount a real read-write /tmp (scratch + any /tmp-targeted output). Set false
# to use an ephemeral tmpfs instead (note: /tmp-targeted tool output would then
# not persist past the process).
bind_tmp_rw: true

proc: true       # mount /proc (required by many tools)
dev: minimal     # --dev /dev: /dev/null,/zero,/urandom,etc. only

# Namespace isolation.
unshare:
  - net          # no network — no exfiltration, no DNS
  - pid          # can't see host processes
  - ipc          # isolate IPC

die_with_parent: true   # kill the sandboxed tool if the MCP server dies
new_session: true       # prevent terminal escape via TIOCSTI

# Deterministic environment (additive --setenv; inherited env otherwise intact).
# The real-evidence tool audit found NO installed SIFT tool requires env
# redirection — the dotnet/Zimmerman suite runs clean with HOME unbound — so
# this block is hygiene only: keep the host $HOME path out of the namespace and
# silence dotnet's first-run telemetry/logo probes. It's also the hook for
# hardening stricter profiles. Add per-tool needs here if a future tool requires.
env:
  HOME: /tmp                      # bound RW; don't leak the host home path
  TMPDIR: /tmp
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
